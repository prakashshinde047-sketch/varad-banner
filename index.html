<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VARAD Global Logistics</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4f6f9; display:flex; justify-content:center; padding:20px; }
    .card { max-width:420px; width:100%; background:white; border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.15); }
    .header { background:linear-gradient(135deg,#0b2d6b,#ff7a00); color:#fff; padding:24px; text-align:center; }
    .header h1 { margin:0; font-size:34px; }
    .header p { margin:8px 0 0; }
    .section { padding:20px; }
    .btn { display:block; text-decoration:none; margin:12px 0; padding:14px 16px; border-radius:12px; color:#fff; font-weight:bold; text-align:center; }
    .web,.call,.contact { background:#0b2d6b; }
    .mail,.wa { background:#ff7a00; }
    .qrbox { text-align:center; padding:10px 0 20px; }
    #qrcode canvas { border:8px solid #fff; box-shadow:0 4px 15px rgba(0,0,0,.12); }
    .footer { text-align:center; font-size:14px; color:#444; padding-bottom:20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="/mnt/data/logo(1).png" alt="VARAD Logo" style="width:120px; margin-bottom:14px; background:white; padding:8px; border-radius:16px;" />
      <h1>VARAD</h1>
      <h2 style="margin:6px 0 0;">Global Logistics</h2>
      <p>Safe • Secure • Reliable • On Time</p>
    </div>
    <div class="section">
      <a class="btn web" href="https://varadgloballogistics.com/" target="_blank">🌐 Open Website</a>
      <a class="btn mail" href="mailto:info@varadgloballogistics.com">📧 Send Mail</a>
      <a class="btn call" href="tel:+918879774320">📞 Call Now</a>
      <a class="btn wa" href="https://wa.me/918879774320" target="_blank">💬 WhatsApp</a>
      <a class="btn contact" href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:VARAD Global Logistics%0ATEL:+918879774320%0AEMAIL:info@varadgloballogistics.com%0AURL:https://varadgloballogistics.com/%0AEND:VCARD" download="varad-contact.vcf">👤 Save Contact</a>
      <div class="qrbox">
        <h3>Scan QR to Open Website</h3>
        <div id="qrcode"></div>
      </div>
      <div class="footer">Camera ने scan करा → link popup → tap → website open</div>
    </div>
  </div>
  <script>
    QRCode.toCanvas(document.createElement('canvas'), 'https://varadgloballogistics.com/', { width: 180 }, function (err, canvas) {
      if (!err) document.getElementById('qrcode').appendChild(canvas);
    });
  </script>
</body>
</html>
